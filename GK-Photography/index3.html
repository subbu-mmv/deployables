<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Golden Knot Photography - Event Estimate</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 18px 8px 30px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f7f8fa;
            color: #111827;
        }


        .container,
        .site-header {
            width: 100%;
            max-width: 620px;

            margin-left: auto;
            margin-right: auto;
        }


        /* =================================
           HEADER
        ================================== */

        .site-header {
            text-align: center;
            margin-bottom: 15px;
        }


        .business-name {
            font-size: 22px;
            font-weight: 700;
        }


        .page-subtitle {
            margin-top: 2px;

            font-size: 13px;
            color: #6b7280;
        }


        /* =================================
           GENERAL CARD
        ================================== */

        .card {
            border-radius: 18px;
            padding: 15px;

            margin-bottom: 11px;
        }


        /* =================================
           RATE / DAYS CARD
        ================================== */

        .settings-card {
            background: #edf8f2;

            border: 1.5px solid #8bc9a8;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.04);
        }


        .days-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;
        }


        .days-label {
            font-size: 17px;
            font-weight: 650;
        }


        /* =================================
           DAYS STEPPER
        ================================== */

        .days-stepper {
            height: 42px;

            display: grid;
            grid-template-columns: 40px 42px 40px;

            align-items: center;

            background: white;

            border: 1.5px solid #b8c9c0;
            border-radius: 12px;

            overflow: hidden;
        }


        .days-stepper button {
            height: 100%;

            border: none;
            background: transparent;

            font-size: 22px;
            font-weight: 600;

            cursor: pointer;

            touch-action: manipulation;
        }


        .days-stepper .minus {
            color: #dc2626;
        }


        .days-stepper .plus {
            color: #15803d;
        }


        .days-stepper button:active {
            background: #f1f5f9;
        }


        .days-value {
            text-align: center;

            font-size: 19px;
            font-weight: 650;
        }


        /* =================================
           RATE GRID
        ================================== */

        .rate-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 9px;

            margin-top: 13px;
        }


        .rate-label {
            display: block;

            margin-bottom: 4px;
            padding-left: 2px;

            font-size: 12px;
            font-style: italic;

            color: #374151;
        }


        .money-input {
            position: relative;
        }


        .money-input span {
            position: absolute;

            left: 10px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;

            color: #374151;

            pointer-events: none;
        }


        .money-input input {
            width: 100%;
            height: 30px;

            padding: 0 8px 0 29px;

            border: 1.5px solid #b8c9c0;
            border-radius: 10px;

            background: white;

            font-family: inherit;

            font-size: 16px;

            color: #166534;

            outline: none;
        }


        .money-input input:focus {
            border-color: #22a05a;

            box-shadow:
                0 0 0 3px rgba(34, 160, 90, 0.10);
        }


        /* =================================
           DAY TABLE
        ================================== */

        .table-card {
            background: #f1f6ff;

            border: 1.5px solid #bdd4ff;

            padding: 10px 6px;

            overflow: hidden;
        }


        .day-table {
            width: 100%;

            border-collapse: separate;
            border-spacing: 0 3px;

            table-layout: fixed;
        }


        .day-table th {
            padding: 3px 1px 5px;

            font-size: 11px;
            font-weight: 650;

            color: #374151;

            text-align: center;
        }


        .day-table th:first-child {
            text-align: left;
            width: 54px;
        }


        .day-table td {
            padding: 3px 1px;

            text-align: center;
        }


        .day-table td:first-child {
            text-align: left;

            padding-left: 2px;

            font-size: 13px;
            font-weight: 600;

            color: #1f2937;
        }


        /* =================================
           CREW STEPPER
        ================================== */

        .crew-stepper {
            height: 34px;

            display: grid;

            grid-template-columns:
                minmax(22px, 1fr)
                30px
                minmax(22px, 1fr);

            align-items: center;

            width: 100%;

            background: white;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            overflow: hidden;
        }


        .crew-stepper button {
            height: 100%;

            padding: 0;

            border: none;
            background: transparent;

            font-size: 17px;
            font-weight: 650;

            cursor: pointer;

            touch-action: manipulation;
        }


        .crew-stepper .minus {
            color: #dc2626;
        }


        .crew-stepper .plus {
            color: #15803d;
        }


        .crew-stepper button:active {
            background: #f1f5f9;
        }


        .crew-value {
            text-align: center;

            font-size: 14px;
            font-weight: 600;
        }


        /* =================================
           ADDITIONAL
        ================================== */

        .additional-card {
            background: #fff8e7;

            border: 1.5px solid #f0d99a;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.035);
        }


        .additional-title {
            margin-bottom: 9px;

            font-size: 17px;
            font-weight: 650;
        }


        .additional-header {
            display: grid;

            grid-template-columns: 1fr 88px 70px;

            gap: 7px;

            margin-bottom: 5px;

            color: #6b7280;

            font-size: 10px;
            font-weight: 600;
            text-align: center;
        }


        .additional-header span:first-child {
            text-align: left;
        }


        .additional-row {
            display: grid;

            grid-template-columns: 1fr 88px 70px;

            align-items: center;

            gap: 7px;

            margin-bottom: 7px;
        }


        .additional-row:last-child {
            margin-bottom: 0;
        }


        .additional-label {
            font-size: 12px;
            color: #374151;

            min-width: 0;
        }


        .additional-input,
        .count-stepper {
            height: 25px;

            display: grid;

            grid-template-columns: 22px 1fr 22px;

            align-items: center;

            background: white;

            border: 1px solid #d4d4d4;
            border-radius: 8px;

            overflow: hidden;
        }


        .count-stepper button {
            height: 100%;

            padding: 0;

            border: none;
            background: transparent;

            font-size: 15px;
            font-weight: 650;

            cursor: pointer;

            touch-action: manipulation;
        }


        .count-stepper .count-minus {
            color: #dc2626;
        }


        .count-stepper .count-plus {
            color: #15803d;
        }


        .count-stepper button:active {
            background: #f1f5f9;
        }


        .additional-input span {
            position: absolute;

            left: 6px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 13px;
            color: #374151;

            pointer-events: none;
        }


        .additional-input input,
        .count-input input {
            width: 100%;
            height: 25px;

            border: 1px solid #d4d4d4;
            border-radius: 8px;

            background: white;

            font-family: inherit;
            font-size: 13px;

            outline: none;
        }


        .additional-input input {
            padding: 0 6px 0 23px;

            text-align: right;
        }


        .count-stepper input {
            width: 100%;
            height: 100%;

            padding: 0;

            border: none;

            background: transparent;

            text-align: center;

            font-family: inherit;
            font-size: 13px;

            outline: none;

            appearance: textfield;
            -moz-appearance: textfield;
        }


        .count-stepper input::-webkit-inner-spin-button,
        .count-stepper input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }


        .additional-input input:focus,
        .count-stepper:focus-within {
            border-color: #d5a72a;

            box-shadow:
                0 0 0 3px rgba(213, 167, 42, 0.10);
        }


        .other-input {
            grid-column: 2 / 4;
        }


        /* =================================
           SUMMARY
        ================================== */

        .summary-card {
            background: white;

            border: 1.5px solid #8bc9a8;

            padding: 17px;
        }


        .summary-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            align-items: center;
        }


        .total-section {
            text-align: center;
        }


        .total-label {
            font-size: 12px;
            font-weight: 650;

            color: #166534;

            margin-bottom: 3px;
        }


        .total-value {
            font-size: 28px;
            font-weight: 750;

            color: #166534;

            white-space: nowrap;
        }


        .breakdown {
            border-left: 1px solid #d1d5db;

            padding-left: 15px;
        }


        .breakdown-row {
            display: flex;

            justify-content: space-between;

            gap: 8px;

            font-size: 12px;

            margin-bottom: 5px;
        }


        .breakdown-row.total {
            border-top: 1px solid #d1d5db;

            padding-top: 5px;
            margin-top: 3px;

            color: #166534;

            font-weight: 650;
        }


        /* =================================
           BUTTONS
        ================================== */

        .buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 9px;

            margin-top: 10px;
        }


        .action-button {
            height: 42px;

            border-radius: 11px;

            border: 1.5px solid #d1d5db;

            background: white;

            font-family: inherit;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            touch-action: manipulation;
        }


        .reset-button {
            background: #16834c;

            color: white;

            border-color: #16834c;
        }


        /* =================================
           SMALL PHONES
        ================================== */

        @media (max-width: 380px) {

            body {
                padding-left: 5px;
                padding-right: 5px;
            }


            .card {
                padding: 12px;
            }


            .table-card {
                padding-left: 3px;
                padding-right: 3px;
            }


            .day-table th {
                font-size: 10px;
            }


            .day-table th:first-child {
                width: 49px;
            }


            .day-table td:first-child {
                font-size: 12px;
            }


            .crew-stepper {
                grid-template-columns:
                    minmax(18px, 1fr)
                    20px
                    minmax(18px, 1fr);
            }


            .crew-stepper button {
                font-size: 15px;
            }


            .crew-value {
                font-size: 13px;
            }


            .total-value {
                font-size: 25px;
            }


            .additional-row,
            .additional-header {
                grid-template-columns: 1fr 78px 52px;
                gap: 5px;
            }


            .additional-label {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="business-name">
        Golden Knot Photography
    </div>

    <div class="page-subtitle">
        Event Estimate Calculator
    </div>

</header>


<div class="container">


    <!-- =================================
         DAYS + RATES
    ================================== -->

    <div class="card settings-card">


        <div class="days-row">

            <div class="days-label">
                Number of Days
            </div>


            <div class="days-stepper">

                <button
                    class="minus"
                    onclick="changeDays(-1)"
                >
                    −
                </button>


                <div
                    class="days-value"
                    id="daysValue"
                >
                    1
                </div>


                <button
                    class="plus"
                    onclick="changeDays(1)"
                >
                    +
                </button>

            </div>

        </div>


        <div class="rate-grid">


            <div>

                <label class="rate-label">
                    Photographer Avg.
                </label>


                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="photographerRate"
                        type="text"
                        inputmode="numeric"
                        oninput="
                            formatRate(this);
                            calculateTotal();
                        "
                    >

                </div>

            </div>


            <div>

                <label class="rate-label">
                    Videographer Avg.
                </label>


                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="videographerRate"
                        type="text"
                        inputmode="numeric"
                        oninput="
                            formatRate(this);
                            calculateTotal();
                        "
                    >

                </div>

            </div>

        </div>

    </div>


    <!-- =================================
         DAY TABLE
    ================================== -->

    <div class="card table-card">

        <table class="day-table">

            <thead>

                <tr>

                    <th>
                        Day
                    </th>

                    <th>
                        📷 Photographers
                    </th>

                    <th>
                        🎥 Videographers
                    </th>

                </tr>

            </thead>


            <tbody id="daysContainer"></tbody>

        </table>

    </div>


    <!-- =================================
         ADDITIONAL
    ================================== -->

    <div class="card additional-card">

        <div class="additional-title">
            Additional
        </div>


        <div class="additional-header">

            <span>
                Item
            </span>

            <span>
                Rate
            </span>

            <span>
                Count
            </span>

        </div>


        <div
            class="additional-table"
            id="additionalContainer"
        ></div>

    </div>


    <!-- =================================
         SUMMARY
    ================================== -->

    <div class="card summary-card">

        <div class="summary-grid">


            <div class="total-section">

                <div class="total-label">
                    ESTIMATED TOTAL
                </div>

                <div
                    class="total-value"
                    id="totalAmount"
                >
                    ₹0
                </div>

            </div>


            <div class="breakdown">


                <div class="breakdown-row">

                    <span>
                        Photographers
                    </span>

                    <span id="photographerTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row">

                    <span>
                        Videographers
                    </span>

                    <span id="videographerTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row">

                    <span>
                        Additional
                    </span>

                    <span id="additionalTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row total">

                    <span>
                        TOTAL
                    </span>

                    <span id="breakdownTotal">
                        ₹0
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- =================================
         ACTIONS
    ================================== -->

    <div class="buttons">

        <button
            class="action-button reset-button"
            onclick="resetCalculator()"
        >
            ↻ &nbsp; Reset
        </button>


        <button
            class="action-button"
            onclick="window.print()"
        >
            ⎙ &nbsp; Print / Save
        </button>

    </div>


</div>


<!--
===========================================================
IMPORTANT:

prices.js contains ONLY the default prices/item definitions.
Keep it in the same folder as index.html.

It is loaded first so index.html can use PRICES.
===========================================================
-->

<script src="prices.js"></script>


<script>


    /* =================================
       STATE
    ================================== */

    let numberOfDays = 1;


    /* =================================
       CURRENCY
    ================================== */

    function formatCurrency(amount) {

        return "₹" +
            Math.round(amount)
                .toLocaleString("en-IN");

    }


    /* =================================
       FORMAT RATE
    ================================== */

    function formatRate(input) {

        let value =
            input.value.replace(/\D/g, "");


        if (value === "") {

            input.value = "";

            return;

        }


        input.value =
            Number(value).toLocaleString("en-IN");

    }


    /* =================================
       READ MONEY
    ================================== */

    function readMoneyInput(id) {

        const input =
            document.getElementById(id);


        if (!input) {
            return 0;
        }


        return Number(
            input.value.replace(/,/g, "")
        ) || 0;

    }


    /* =================================
       CHANGE DAYS
    ================================== */

    function changeDays(change) {

        numberOfDays += change;


        if (numberOfDays < 1) {
            numberOfDays = 1;
        }


        if (numberOfDays > 5) {
            numberOfDays = 5;
        }


        document.getElementById("daysValue")
            .textContent = numberOfDays;


        generateDays();

        calculateTotal();

    }


    /* =================================
       GENERATE DAY TABLE
    ================================== */

    function generateDays() {

        const container =
            document.getElementById("daysContainer");


        container.innerHTML = "";


        for (
            let i = 1;
            i <= numberOfDays;
            i++
        ) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    Day-${i}
                </td>


                <td>

                    <div class="crew-stepper">

                        <button
                            class="minus"
                            onclick="
                                changeCrew(
                                    ${i},
                                    'photographer',
                                    -1
                                )
                            "
                        >
                            −
                        </button>


                        <div
                            class="crew-value"
                            id="photo-${i}"
                        >
                            1
                        </div>


                        <button
                            class="plus"
                            onclick="
                                changeCrew(
                                    ${i},
                                    'photographer',
                                    1
                                )
                            "
                        >
                            +
                        </button>

                    </div>

                </td>


                <td>

                    <div class="crew-stepper">

                        <button
                            class="minus"
                            onclick="
                                changeCrew(
                                    ${i},
                                    'videographer',
                                    -1
                                )
                            "
                        >
                            −
                        </button>


                        <div
                            class="crew-value"
                            id="video-${i}"
                        >
                            1
                        </div>


                        <button
                            class="plus"
                            onclick="
                                changeCrew(
                                    ${i},
                                    'videographer',
                                    1
                                )
                            "
                        >
                            +
                        </button>

                    </div>

                </td>

            `;


            container.appendChild(row);

        }

    }


    /* =================================
       CHANGE CREW
    ================================== */

    function changeCrew(
        day,
        type,
        change
    ) {

        const prefixes = {
            photographer: "photo",
            videographer: "video"
        };


        const prefix =
            prefixes[type];


        const element =
            document.getElementById(
                `${prefix}-${day}`
            );


        let value =
            parseInt(element.textContent);


        value += change;


        if (value < 0) {
            value = 0;
        }


        if (value > 9) {
            value = 9;
        }


        element.textContent = value;


        calculateTotal();

    }


    /* =================================
       GENERATE ADDITIONAL ITEMS
    ================================== */

    function generateAdditionalItems() {

        const container =
            document.getElementById(
                "additionalContainer"
            );


        container.innerHTML = "";


        for (
            const [key, item]
            of Object.entries(PRICES.additional)
        ) {

            const row =
                document.createElement("div");


            row.className =
                "additional-row";


            row.innerHTML = `

                <div
                    class="additional-label"
                >
                    ${item.name}
                </div>


                <div
                    class="additional-input"
                >

                    <span>₹</span>

                    <input
                        id="${key}Rate"
                        type="text"
                        inputmode="numeric"
                        oninput="
                            formatRate(this);
                            calculateTotal();
                        "
                    >

                </div>


                <div class="count-stepper">

                    <button
                        type="button"
                        class="count-minus"
                        onclick="
                            changeAdditionalCount('${key}', -1)
                        "
                    >
                        −
                    </button>

                    <input
                        id="${key}Count"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        value="0"
                        oninput="
                            sanitizeCount(this);
                            calculateTotal();
                        "
                    >

                    <button
                        type="button"
                        class="count-plus"
                        onclick="
                            changeAdditionalCount('${key}', 1)
                        "
                    >
                        +
                    </button>

                </div>

            `;


            container.appendChild(row);

        }


        /* --------------------------------
           OTHER / EXTRA
        -------------------------------- */

        const otherRow =
            document.createElement("div");


        otherRow.className =
            "additional-row";


        otherRow.innerHTML = `

            <div class="additional-label">
                Other / Extra
            </div>


            <div
                class="additional-input other-input"
            >

                <span>₹</span>

                <input
                    id="other"
                    type="text"
                    inputmode="numeric"
                    oninput="
                        formatRate(this);
                        calculateTotal();
                    "
                >

            </div>

        `;


        container.appendChild(otherRow);

    }


    /* =================================
       CHANGE ADDITIONAL COUNT
    ================================== */

    function changeAdditionalCount(key, change) {

        const input =
            document.getElementById(`${key}Count`);

        let value = parseInt(input.value, 10);

        if (Number.isNaN(value)) {
            value = 0;
        }

        value += change;

        if (value < 0) {
            value = 0;
        }

        input.value = value;

        calculateTotal();

    }


    /* =================================
       SANITIZE ADDITIONAL COUNT
    ================================== */

    function sanitizeCount(input) {

        input.value =
            input.value.replace(/\D/g, "");

    }


    /* =================================
       CALCULATE
    ================================== */

    function calculateTotal() {

        const photographerRate =
            readMoneyInput(
                "photographerRate"
            );


        const videographerRate =
            readMoneyInput(
                "videographerRate"
            );


        let photographerTotal = 0;

        let videographerTotal = 0;


        for (
            let i = 1;
            i <= numberOfDays;
            i++
        ) {

            const photographers =
                Number(
                    document
                        .getElementById(
                            `photo-${i}`
                        )
                        .textContent
                );


            const videographers =
                Number(
                    document
                        .getElementById(
                            `video-${i}`
                        )
                        .textContent
                );


            photographerTotal +=
                photographers *
                photographerRate;


            videographerTotal +=
                videographers *
                videographerRate;

        }


        /* --------------------------------
           ADDITIONAL
        -------------------------------- */

        let additionalTotal = 0;


        for (
            const key
            of Object.keys(PRICES.additional)
        ) {

            const rate =
                readMoneyInput(
                    `${key}Rate`
                );


            const count =
                Number(
                    document
                        .getElementById(
                            `${key}Count`
                        )
                        .value
                ) || 0;


            additionalTotal +=
                rate * count;

        }


        const other =
            readMoneyInput("other");


        additionalTotal += other;


        /* --------------------------------
           TOTAL
        -------------------------------- */

        const total =
            photographerTotal +
            videographerTotal +
            additionalTotal;


        /* --------------------------------
           UPDATE DISPLAY
        -------------------------------- */

        document.getElementById(
            "photographerTotal"
        ).textContent =
            formatCurrency(
                photographerTotal
            );


        document.getElementById(
            "videographerTotal"
        ).textContent =
            formatCurrency(
                videographerTotal
            );


        document.getElementById(
            "additionalTotal"
        ).textContent =
            formatCurrency(
                additionalTotal
            );


        document.getElementById(
            "totalAmount"
        ).textContent =
            formatCurrency(total);


        document.getElementById(
            "breakdownTotal"
        ).textContent =
            formatCurrency(total);

    }


    /* =================================
       RESET
    ================================== */

    function resetCalculator() {

        numberOfDays = 1;


        document.getElementById(
            "daysValue"
        ).textContent = "1";


        document.getElementById(
            "photographerRate"
        ).value =
            PRICES.dayRates.photographer
                .toLocaleString("en-IN");


        document.getElementById(
            "videographerRate"
        ).value =
            PRICES.dayRates.videographer
                .toLocaleString("en-IN");


        /* --------------------------------
           Reset additional rates/counts
        -------------------------------- */

        for (
            const [key, item]
            of Object.entries(PRICES.additional)
        ) {

            const rateInput =
                document.getElementById(
                    `${key}Rate`
                );


            const countInput =
                document.getElementById(
                    `${key}Count`
                );


            if (rateInput) {

                rateInput.value =
                    item.rate
                        .toLocaleString("en-IN");

            }


            if (countInput) {

                countInput.value = 0;

            }

        }


        document.getElementById(
            "other"
        ).value = "0";


        generateDays();

        calculateTotal();

    }


    /* =================================
       INITIALIZE
    ================================== */

    generateAdditionalItems();

    resetCalculator();


</script>


</body>

</html>
