<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Minimal Pyodide + Pandas Example</title>
  </head>
  <body>
    <h3>Select a CSV file. Hehe</h3>
    <input type="file" id="fileInput" accept=".csv" />
    <pre id="log"></pre>
    <pre id="output"></pre>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <script type="module">

      console.log("Loading Pyodide...");
      import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.mjs";
      const pyodide = await loadPyodide();
      await pyodide.loadPackage("pandas");
      console.log("Pyodide and pandas loaded.");

      // Fetch external script.py
      const response = await fetch("script.py");
      const pythonCode = await response.text();

      const output = document.getElementById("output");
      const logArea = document.getElementById("log");
      const log = (msg) => {
        console.log(msg);
        logArea.textContent += msg + "\n";
      };

      async function main() {
        document.getElementById("fileInput").addEventListener("change", async (event) => {
          const file = event.target.files[0];
          const text = await file.text();

          // Make CSV data accessible in Python
          pyodide.globals.set("csv_text", text);

          // Define a wrapper to run the function in script.py
          const wrappedCode = `
  ${pythonCode}
  result = process_csv(csv_text)
  result.to_string()
  `;

          console.log("Running Python script...");
          const result = await pyodide.runPythonAsync(wrappedCode);
          console.log("Python returned:", result);
          output.textContent = result;
        });
      }

      main();
    </script>
  </body>
</html>
