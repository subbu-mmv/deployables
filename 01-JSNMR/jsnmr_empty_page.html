<script>var infowin = new Array();
var infotxt = new Array();
var infodefs = 0;
var infocolor = 0;
var infofilter, infofe;
for (i=0; i<10; i++) {
	infowin[i] = 0;
  infotxt[i] = 0;
}

	infowin[i] = 0;
	infotxt[i] = 0;
}

  // Center:
  // return window.innerWidth/2-100;
  // Left:
	return 20;
}

	return 20+infoj*100;
}

	showinfo(txt, title, timeout);
	infocolor = 0;

	var dur = 1000;
	var dly = 2000;
	if (timeout > 0) {
		dly = timeout*1000;
	}
	if (infocolor == 0) {
		color = "blue";
	} else {
		color = infocolor;

		infoj++;

	var html = "<html><body>";
	if (typeof title === "undefined") {
		html += "<p style='font-weight:bold;color:" + color + ";font-size:11pt;font-family:Arial;text-align:center'>Info</p>";

		.style("fill", "#ddd")
		.style("cursor", "wait")

			.transition()
			.delay((dly+1.0*dur))
			.remove();
	}
	
}

var QueryString = function () {
// This function is anonymous, is executed immediately and
// the return value is assigned to QueryString!
var query_string = {};
var query = window.location.search.substring(1);
var vars = query.split("&");
for (var i=0;i<vars.length;i++) {
var pair = vars[i].split("=");
// If first entry with this name
if (typeof query_string[pair[0]] === "undefined") {
query_string[pair[0]] = pair[1];
// If second entry with this name
} else if (typeof query_string[pair[0]] === "string") {
var arr = [ query_string[pair[0]], pair[1] ];
query_string[pair[0]] = arr;
// If third or later entry with this name
} else {
query_string[pair[0]].push(pair[1]);
}
}
return query_string;
} ();

function reduce_size(setnp) {
var before = spectra.length;
console.log("Reducing " + current);
if (spectra[current] != null) {
spec = spectra[current];
//		showinfo("Starting reduction " + spec.type);
if (spec.np <= setnp) return;
if (spec.type != 1) return;
if (typeof setnp !== "undefined") {
var newnp = setnp;
} else {
var newnp = Math.pow(2, Math.floor(Math.log(spec.np)/Math.log(2)));
console.log(newnp);
if (newnp > spec.np*0.75) {newnp /= 2;}
}
var dat = new complex_array.ComplexArray(spec.np, Float32Array);
//		showinfo("Data length: " + dat.length + " " + spec.title);
var tmprmax = -1e9, tmpimax = -1e9;
if (typeof spec.ph0 === "undefined") {spec.ph0 = 0;}
if (typeof spec.ph1 === "undefined") {spec.ph1 = 0;}
var ph1 = 1*spec.ph1;
for (i=0; i<spec.np; i++) {
if (Math.abs(spec.re[i]) > tmprmax) {tmprmax = Math.abs(spec.re[i]);}
if (Math.abs(spec.im[i]) > tmpimax) {tmpimax = Math.abs(spec.im[i]);}
var ph = 3.1415927*(1*spec.ph0 + 1*i*ph1/spec.np)/180.0;
cp = Math.cos(ph);
sp = Math.sin(ph);
dat.real[i] = 1*cp*spec.re[i] - 1*sp*spec.im[i];
dat.imag[i] = 1*sp*spec.re[i] + 1*cp*spec.im[i];
}
/*
if (tmprmax/4 > tmpimax) {
ph = 180/3.1415927*spec.np/2;
}
*/
console.log("TEST1: " + spec.ph0 + " " + spec.ph1);
dat.InvFFT();
re = dat.real;
im = dat.imag;
var dat = new complex_array.ComplexArray(newnp, Float32Array);
showinfo("Reducing spectrum size from " + spec.np + " to " + newnp, "Changing spectrum");
var fac = Math.exp(-3.1415927*(1.0/newnp-1.0/spec.np));
var sc = 1;
for (i=0; i<newnp; i++) {
dat.real[i] = re[i]*sc;
dat.imag[i] = im[i]*sc;
sc = sc * fac;
}
console.log("FAC: " + sc);
dat.FFT();
if (typeof setnp !== "undefined") {
console.log("Don't copy");
newspec = spec;
newspec.np = newnp;
} else {
spectra.push(new Object());
newspec = spectra[spectra.length-1];
newspec.sw = spec.sw;
newspec.np = newnp;
newspec.ref = spec.ref;
newspec.raw = spec.raw;
newspec.ph0 = spec.ph0;
newspec.ph1 = spec.ph1;
newspec.type = spec.type;
if (spec.title == '') {
newspec.title = "Reduced";
} else {
newspec.title = spec.title + " red";
}
}
tmpimax = -1e9;
for (i=0; i<newspec.np; i++) {
if (Math.abs(dat.real[i]) > tmpimax) {tmpimax = Math.abs(dat.real[i]);}
}
//		console.log(newspec.re[1] + " tmpimax: " + dat.real[1]);
//		return;
newspec.re = new Float32Array(newnp);
newspec.im = new Float32Array(newnp);
sc = tmprmax/tmpimax;
for (i=0; i<newnp; i++) {
newspec.re[i] = sc*dat.real[i];
newspec.im[i] = sc*dat.imag[i];
}
}
if (typeof setnp === "undefined") {
current = spectra.length-1;
updateSpecs(before);
}
}

function findNearestPeak(position, spec) {
if (findingpeaks == 1) return;
findingpeaks = 1;
console.log(position);
mousedown = true;
var x = Math.round( spec.Hz2PT(xScaleInv(position[0])) );
var r = Math.round( (spec.Hz2PT(xScaleInv(position[0]))
- spec.Hz2PT(xScaleInv( (position[0]+window.innerWidth/10)))) );
//	console.log("X: " + x + " R: " + r + " Pos: " + position[0]);
var min = x > r ? x-r:0;
var max = x > spec.np-r ? spec.np:x+r;
//	console.log("Index: " + x + ", min: " + min + ", max: "+max);
var th = spec.yScaleInv(position[1])/2;
//showinfo("TH: " + th.toExponential() + ", r: " + r);
// Find nearest peak positive and negative
var yymaxp = -1e9;
var iimaxp = -1;
var yymaxn = -1e9;
var iimaxn = -1;
var iimax = -1;
for (i=x; i<max-1; i++) {
if (spec.lineY[i] >= spec.lineY[i-1] && spec.lineY[i] >= spec.lineY[1*i+1*1] && spec.lineY[i] >= th) {
iimaxp = i;
yymaxp = spec.lineY[i];
break;
}
}
for (i=x; i>min+1; i--) {
if (spec.lineY[i] >= spec.lineY[i-1] && spec.lineY[i] >= spec.lineY[1*i+1*1] && spec.lineY[i] >= th) {
iimaxn = i;
yymaxn = spec.lineY[i];
break;
}
}
if (iimaxn == -1 && iimaxp == -1) {findingpeaks = 0; return;}
if (iimaxn == -1) {
iimax = iimaxp;
console.log("CASE 1: " + iimaxn + " " + iimaxp);
} else if (iimaxp == -1) {
iimax = iimaxn;
console.log("CASE 2: " + iimaxn + " " + iimaxp);
} else if (iimaxp == x || iimaxn == x) {
if (yymaxp > yymaxn) {
iimax = iimaxp;
console.log("CASE 3: " + iimaxn + " " + iimaxp);
} else {
iimax = iimaxn;
console.log("CASE 4: " + iimaxn + " " + iimaxp);
}
} else if (iimaxp-x > x - iimaxn) {
iimax = iimaxn;
console.log("CASE 5: " + iimaxn + " " + iimaxp);
} else {
iimax = iimaxp;
console.log("CASE 6: " + iimaxn + " " + iimaxp);
}
console.log("IIMAX: " + iimax + " " + iimaxn + " " + iimaxp);
var match = 0;
spec.peaks.forEach(function(p) {
if (p.freqPt == iimax+1*1) {
showinfo("<table style='font-size: 10pt'><tr><td>Freq:</td><td>" + p.freq.toFixed(2) + "</td></tr>"
+ "<tr><td>Point:</td><td>" + p.freqPt + "</td></tr>"
+ "<tr><td>Int:</td><td>" + p.int.toFixed(2) + "</td></tr></table>", "Peak already picked");
match = 1;
}
});
if (match == 1) {findingpeaks = 0; return;}
var peak = new Object();
peak.freqPt = iimax+1*1;
peak.freq = spec.PT2Hz(peak.freqPt);
peak.int = spec.re[iimax];
showinfo("<table style='font-size: 10pt'><tr><td>Freq:</td><td>" + peak.freq.toFixed(2) + "</td></tr>"
+ "<tr><td>Point:</td><td>" + peak.freqPt + "</td></tr>"
+ "<tr><td>Int:</td><td>" + peak.int.toFixed(2) + "</td></tr></table>", "New peak found");
console.log("Peak position: " + peak.freq);
console.log("Peak pos (Pt): " + peak.freqPt + ". Control: " + spec.re[iimax-1]/1.0e6 + " " + spec.re[iimax]/1.0e6 + " " + spec.re[1*iimax+1*1]/1.0e6);
var nfix = -Math.round(Math.log(spec.sw/spec.np)/Math.log(10));
if (nfix < 0) nfix = 0;
peak.line = svg.append("line")
.attr("x1", xScale(peak.freq))
.attr("x2", xScale(peak.freq))
.attr("y1", spec.yScale(peak.int)-10)
.attr("y2", spec.yScale(peak.int)-50)
.attr("stroke", "orange");
peak.text = svg.append("svg:text")
.attr("y", 0)
.attr("x", 0)
.text(peak.freq.toFixed(nfix))
.attr("font-family", "sans-serif")
.attr("font-size", "8pt")
.attr("style", "fill: orange")
.attr("transform", function(d) {return "translate("+(xScale(peak.freq)+5)+","+(spec.yScale(peak.int)-60)
+") rotate(-90)";});
spec.peaks.push(peak);
findingpeaks = 0;
}

function simpsonToFloat(dl) {
var rdl = ((dl>>0) & 0xff) << 24 | ((dl>>8) & 0xff) << 16 |
((dl>>16) & 0xff) << 8 | ((dl>>24) & 0xff) << 0;
var sign = (rdl >> 31);
var e = (rdl >> 23) & ((1<<8)-1);
var m = (rdl & ((1<<23)-1));

return (2.0*sign+1)*m*Math.pow(2.0,e-150);
}

function isPosSQZ(c) {
return c.match(/[@-I]/);
}
function isNegSQZ(c) {
return c.match(/[a-i]/);
}
function isPosDIF(c) {
return (c == "%" || c.match(/[J-R]/));
}
function isNegDIF(c) {
return c.match(/[j-r]/);
}
function isPosDUP(c) {
return (c == "s" || c.match(/[S-Z]/));
}
function readASDFNumbers(str, ary, cp) {
c = str.charAt(0);
mod = 0;
if (isPosSQZ(c)) {
v = 1*(c.charCodeAt(0) - "@".charCodeAt(0));
mod = 1;
sign = 1;
} else if (isNegSQZ(c)) {
v = -1*(c.charCodeAt(0) - "a".charCodeAt(0)+1);
mod = 1;
sign = -1;
} else if (isPosDIF(c)) {
if (c == "%") {
v = 0;
} else {
v = 1*(c.charCodeAt(0) - "J".charCodeAt(0)+1);
}
mod = 2;
sign = 1;
} else if (isNegDIF(c)) {
v = -1*(c.charCodeAt(0) - "j".charCodeAt(0)+1);
mod = 2;
sign = -1;
}
if (mod == 0) {
return 0;
}
i = 1;
cnext = str.charAt(i);
while (cnext.match(/[0-9]/)) {
v = 10*v + sign*cnext;
i++;
cnext = str.charAt(i);
}
dup = 1;
if (isPosDUP(cnext)) {
c = cnext;
i++;
if (c == "s") {
dup = 9;
} else {
dup = 1*(c.charCodeAt(0) - "S".charCodeAt(0)+1);
}
cnext = str.charAt(i);
while (cnext.match(/[0-9]/)) {
dup = 10*dup + 1*cnext;
i++;
cnext = str.charAt(i);
}
}
str = str.substr(i);
i = cp+1;
min = cp-dup+1;
while (i > min) {
if (mod == 2) {
prev = ary[i];
i--;
ary[i] = 1*(prev + v);
} else {
i--;
ary[i] = v;
}
}
//	console.log("val: " + v + ", mode: " + mod + ", dup: ", dup);
cp -= dup;
return new Array(str, cp);
}

function getShort(bytes, index) {
var int = new Int16Array(1);
/*
console.log("getShort (" + (2*index) + "): " + bytes[2*index]);
console.log("getShort (" + (2*index+1) + "): " + bytes[2*index+1]);
*/
int[0] = 0;
int[0] += bytes[2*index]<<8
int[0] += bytes[2*index+1];
return int[0];
}
function getLong(bytes, index) {
var int = new Int32Array(1);
/*
console.log("getLong (" + (4*index) + "): " + bytes[4*index]);
console.log("getLong (" + (4*index+1) + "): " + bytes[4*index+1]);
console.log("getLong (" + (4*index+2) + "): " + bytes[4*index+2]);
console.log("getLong (" + (4*index+3) + "): " + bytes[4*index+3]);
*/
int[0] = 0;
int[0] += bytes[4*index]<<24;
int[0] += bytes[4*index+1]<<16;
int[0] += bytes[4*index+2]<<8;
int[0] += bytes[4*index+3];
return int[0];
}
function getReverseFloat(bytes, index) {
var ab = new ArrayBuffer(4);
var ch = new Int8Array(ab);
var int = new Int32Array(ab);
ch[3] = bytes[4*index+0];
ch[2] = bytes[4*index+1];
ch[1] = bytes[4*index+2];
ch[0] = bytes[4*index+3];
//	console.log((index-14) + ": " + int[0]);
return int[0];
}
function loadAGILENT(title, data, procpar) {
//	typedef struct _VNMRfilehead {
//	 long   nblocks;      /* number of blocks in file */
//	 long   ntraces;      /* number of traces per block */
//	 long   np;           /* number of elements per trace */
//	 long   ebytes;       /* number of bytes per element */
//	 long   tbytes;       /* number of bytes per trace */
//	 long   bbytes;       /* number of bytes per block */
//	 short  vers_id;      /* software version & file_id status bits */
//	 short  status;       /* status of whole file */
//	 long   nbheaders;    /* number of block headers */
//	} VNMRfilehead;
//	typedef struct _VNMRblockhead {
//	 short  scale;        /* scaling factor */
//	 short  status;       /* status of data in block */
//	 short  index;        /* block index */
//	 short  mode;         /* mode of data in block */
//	 long   ctcount;      /* ct value for FID */
//	 float  lpval;        /* f2 (2D-f1) left phase in phasefile */
//	 float  rpval;        /* f2 (2D-f1) right phase in phasefile */
//	 float  lvl;          /* level drift correction */
//	 float  tlt;          /* tilt drift correction */
//	} VNMRblockhead;
var ary = procpar.split('\n');
var llp = 0;
var rrp = 0;
var np = 0;
var sw = 0;
var ref = 0;
var sp = 0;
var sfrq = 0;
for (var i=0; i<ary.length-1; i++) {
var tt = ary[i].split(" ");
var v = tt[0];
if (v.match(/[A-Za-z]/)) {
tt = ary[i+1].split(" ");
if (v == "sw") {
sw = eval(tt[1]);
} else if (v == "np") {
np = eval(tt[1]);
} else if (v == "lp") {
llp = eval(tt[1]);
} else if (v == "rp") {
rrp = eval(tt[1]);
} else if (v == "sp") {
sp = eval(tt[1]);
} else if (v == "sfrq") {
sfrq = eval(tt[1]);
}
}
}
if (sfrq != 0) {
sw = sw/sfrq;
sp = sp/sfrq;
}
ref = sp + sw/2;
console.log("SW: " + sw);
console.log("NP: " + np);
console.log("LP: " + llp);
console.log("RP: " + rrp);
console.log("SP: " + sp);
rrp = - rrp;
llp = - llp;
var bytes = new Int8Array(data);
var nblocks = getLong(bytes, 0);
var nbh = getLong(bytes, 7);
var indx = getShort(bytes, 18);
var mode = getShort(bytes, 19);
console.log("nblocks: " + nblocks);
console.log("np:      " + np);
console.log("blockhdr: " + nbh);
console.log("Bytes:   " + bytes.length);
console.log("Index:   " + indx);
console.log("Mode:    " + mode)
//	np = 16384;
var before = spectra.length;
spectra.push(new Object());
spec = spectra[spectra.length-1];
spec.ref = ref;
spec.title = title;
spec.sw = sw;
spec.ref = ref;
spec.np = np/2;
var lbfac = 0;
if (npmax != 0) {
if (spec.np > npmax) {
spec.np = npmax;
showinfo("Reducing spectrum size from " + (np/2) + " to " + npmax, "Changing spectrum");
lbfac = Math.exp(-3.1415927*(1.0/npmax - 2.0/np));
np = npmax*2;
}
}
spec.re = new Float32Array(np);
spec.im = new Float32Array(np);
var dat = new complex_array.ComplexArray(np/2);
for (i=0; i<np/2; i++) {
dat.real[i] = getReverseFloat(bytes, 8 + 7*nbh + 2*i);
dat.imag[i] = getReverseFloat(bytes, 8 + 7*nbh + 2*i+1);
//		if (i % 500 == 0) {console.log((2*i)+" " + dat.real[i]);}
}
dat.real[0] /= 2;
dat.imag[0] /= 2;
if (lbfac != 0) {
var sc = 1;
for (i=0; i<npmax; i++) {
dat.real[i] = dat.real[i]*sc;
dat.imag[i] = dat.imag[i]*sc;
sc = sc * lbfac;
}
console.log("FAC: " + sc);
}
dat.FFT();
for (i=0; i<spec.np/2; i++) {
spec.re[i] = dat.real[spec.np/2+i];
spec.im[i] = dat.imag[spec.np/2+i];
spec.re[i+spec.np/2] = dat.real[i];
spec.im[i+spec.np/2] = dat.imag[i];
}
if (phasing) {
for (i=0; i<spec.np; i++) {
var ph = 3.1415927*(i*llp/spec.np + 1.0*rrp)/180.0;
var cp = Math.cos(ph);
var sp = Math.sin(ph);
var re = cp*spec.re[i] - sp*spec.im[i];
var im = sp*spec.re[i] + cp*spec.im[i];
spec.re[i] = re;
spec.im[i] = im;
}
}
updateSpecs(before);
}

}
//		console.log("So far");
if (format == "BINARY") {
var idx=0;
var pts = new Uint8Array(12);

i=0;
while (i<2*spec.np) {

c[1] = data.charCodeAt(idx); idx++;
if (c[1] == 10) {c[1] = data.charCodeAt(idx); idx++}
c[2] = data.charCodeAt(idx); idx++;
if (c[2] == 10) {c[2] = data.charCodeAt(idx); idx++}
c[3] = data.charCodeAt(idx); idx++;

c[1] -= 33;
c[2] -= 33;
c[3] -= 33;
pts[3*j]  = first(6,c[0]) | last(2, c[1]<<2); // 0-5 of c0 and 4-5 of c1

pts[3*j+2] = first(2,c[2]) | last(6, c[3]<<2); // 0-1 of c2 and 0-5 of c3
}
for (k=0; k<3 && i < 2*spec.np; k++) {

for (j=0; j<4; j++) {
p = p << 8;
p |= pts[4*k+j];
s = s + pts[4*k+j] + " ";
}
var f = simpsonToFloat(p);
if (i % 2 == 0) {
spec.re[i/2] = f;
} else {

}

}
}
}
console.log("Updating new spectrum");

}
}
