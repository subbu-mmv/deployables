<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>File fetcher from folder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body class="p-3">
    <h3>🧪 Folder picker</h3>
    <input type="file" id="fileInput" webkitdirectory directory multiple />
    <div id="fileList" class="mt-3"></div>

    <script type="module">
      import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.26.3/full/pyodide.mjs";
      let pyodide;

      async function initPyodide() {
        const fileListDiv = document.getElementById('fileList');
        fileListDiv.innerHTML = '<em>Loading Pyodide...</em>';
        pyodide = await loadPyodide();
        await pyodide.loadPackage("pandas");
        fileListDiv.innerHTML = '<strong>✅ Pyodide and Pandas loaded.</strong>';
      }

      initPyodide();

      document.getElementById('fileInput').addEventListener('change', async function(event) {
        const files = Array.from(event.target.files);
        const fileListDiv = document.getElementById('fileList');
        fileListDiv.innerHTML = '';

        if (files.length === 0) {
          fileListDiv.textContent = 'No files selected.';
          return;
        }

        // Extract unique top-level folder names
        const topFolders = [...new Set(files.map(f => f.webkitRelativePath.split("/")[0]))];
        const pattern = /^(proc.*s|acqu.*s)$/i;
        const matchedFiles = files.filter(f => pattern.test(f.name));

        // Display folder summary
        let outputHTML = `<h5>📂 Selected folders (${topFolders.length}): ${topFolders.join(", ")}</h5>`;
        outputHTML += `<p>Found ${matchedFiles.length} matching files.</p>`;
        outputHTML += '<ul class="list-group">';

        // Write matching files into Pyodide's virtual filesystem
        for (const file of matchedFiles) {
          const arrayBuffer = await file.arrayBuffer();
          const filePath = file.webkitRelativePath;
          const pathParts = filePath.split("/");
          let currentPath = "";
          for (let i = 0; i < pathParts.length - 1; i++) {
            currentPath += (i === 0 ? "" : "/") + pathParts[i];
            try { pyodide.FS.mkdir(currentPath); } catch(e) { /* folder may exist */ }
          }
          pyodide.FS.writeFile(filePath, new Uint8Array(arrayBuffer));

          outputHTML += `<li class="list-group-item">File: ${file.name}, Path: ${file.webkitRelativePath}, Size: ${file.size} bytes</li>`;
        }

        outputHTML += '</ul>';
        fileListDiv.innerHTML = outputHTML;

        // Now run a Python script that lists what got written
        const pyCode = `
import os
from pathlib import Path

files = list(Path('.').rglob('proc*s')) + list(Path('.').rglob('acqu*s'))
"\\n".join(str(p) for p in files)
`;
        const result = await pyodide.runPythonAsync(pyCode);
        const pre = document.createElement('pre');
        pre.textContent = "Python FS content:\n" + result;
        fileListDiv.appendChild(pre);
      });
    </script>
  </body>
</html>
