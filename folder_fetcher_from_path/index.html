<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>File fetcher from folder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <h3>🧪 Folder picker</h3>
    <input type="file" id="fileInput" webkitdirectory directory multiple />
    <div id="fileList" class="mt-3"></div>

    <script>
      document.getElementById('fileInput').addEventListener('change', function(event) {
        const fileList = event.target.files;
        const fileListDiv = document.getElementById('fileList');
        fileListDiv.innerHTML = '';

        if (fileList.length === 0) {
          fileListDiv.textContent = 'No files selected.';
          return;
        }

        const ul = document.createElement('ul');
        ul.classList.add('list-group');

        Array.from(fileList).forEach(file => {
          const li = document.createElement('li');
          li.classList.add('list-group-item');
          li.textContent = `File: ${file.name}, Path: ${file.webkitRelativePath}, Size: ${file.size} bytes`;
          ul.appendChild(li);
        });

        fileListDiv.appendChild(ul);
      });
    </script>

    <script>
      document.getElementById('fileInput').addEventListener('change', function(event) {
        const fileList = event.target.files;
        const fileListDiv = document.getElementById('fileList');
        fileListDiv.innerHTML = '';

        if (fileList.length === 0) {
          fileListDiv.textContent = 'No files selected.';
          return;
        }

        const ul = document.createElement('ul');
        ul.classList.add('list-group');

        // Filter files matching "proc$[s]" or "acqu$[s]"
        const pattern = /(proc*|acqu*)/i;
        const filteredFiles = Array.from(fileList).filter(file =>
          pattern.test(file.name)
        );

        if (filteredFiles.length === 0) {
          fileListDiv.textContent = 'No matching files found.';
          return;
        }

        filteredFiles.forEach(file => {
          const li = document.createElement('li');
          li.classList.add('list-group-item');
          li.textContent = `File: ${file.name}, Path: ${file.webkitRelativePath}, Size: ${file.size} bytes`;
          ul.appendChild(li);
        });

        fileListDiv.appendChild(ul);
      });
    </script>
  </body>
</html>
