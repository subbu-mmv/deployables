<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Folder picker (JS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <h3>🧪 Folder picker</h3>

    <div class="form-check">
      <form class="p-3 border rounded shadow bg-light" style="max-width: 600px;">
        <div class="form-check">
          <label for="fname">First Name: </label>
          <input type="text" id="fname" name="fname"><br>
        </div>

        <div class="form-check">
          <label for="lname">Last Name: </label>
          <input type="text" id="lname" name="lname"><br>
        </div>

        <div class="form-check">
          <label for="tname">Full Name: </label>
          <input type="text" id="tname" name="tname" disabled><br>
        </div>

        <script>
          const fname = document.getElementById("fname");
          const lname = document.getElementById("lname");
          const tname = document.getElementById("tname");

          function updateFullName() {
            tname.value = fname.value + " " + lname.value;
          }

          fname.addEventListener("input", updateFullName);
          lname.addEventListener("input", updateFullName);
        </script>
      </form>

      <br><br>

      <!-- <form id="param-form">
        <input type="radio" id="display-all">
        <label for="display-all">All parameters</label><br>

        <input type="radio" id="display-diff">
        <label for="display-diff">Different paramters</label><br>
      </form> -->

      <form id="param-form" class="p-3 border rounded shadow bg-light" style="max-width: 200px;">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="params" id="display-all">
          <label class="form-check-label" for="display-all">All parameters</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="params" id="display-diff">
          <label class="form-check-label" for="display-diff">Differences only</label>
        </div>
      </form>
    </div>
  </body>
</html>
