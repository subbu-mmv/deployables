<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photography Estimate Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px 40px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f7f8fa;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        /* --------------------------------
           SITE HEADER
        -------------------------------- */

        .site-header {
            width: 100%;
            max-width: 620px;
            margin: 0 auto 18px;
            text-align: center;
        }

        .business-name {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .page-subtitle {
            margin-top: 3px;
            font-size: 13px;
            color: #6b7280;
            font-weight: 450;
        }

        /* --------------------------------
           GENERAL CARD
        -------------------------------- */

        .card {
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 14px;
        }

        /* --------------------------------
           SETTINGS / TOP CARD
        -------------------------------- */

        .settings-card {
            background: #edf8f2;
            border: 1.5px solid #8bc9a8;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .days-title {
            text-align: center;
            font-size: 21px;
            font-weight: 650;
            margin-bottom: 10px;
        }

        /* --------------------------------
           STEPPER
        -------------------------------- */

        .stepper {
            height: 54px;
            display: grid;
            grid-template-columns: 55px 1fr 55px;
            align-items: center;

            background: white;
            border: 1.5px solid #b8c9c0;
            border-radius: 15px;

            overflow: hidden;
        }

        .stepper button {
            height: 100%;
            border: none;
            background: transparent;

            font-size: 27px;
            font-weight: 600;

            cursor: pointer;
            touch-action: manipulation;
        }

        .stepper button.minus {
            color: #dc2626;
        }

        .stepper button.plus {
            color: #15803d;
        }

        .stepper button:active {
            background: #f1f5f9;
        }

        .stepper-value {
            text-align: center;
            font-size: 25px;
            font-weight: 600;
        }

        /* --------------------------------
           RATE INPUTS
        -------------------------------- */

        .rate-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;

            margin-top: 20px;
        }

        .field-label {
            display: block;

            font-size: 15px;
            font-style: italic;
            font-weight: 500;

            margin: 0 0 7px 3px;
        }

        .money-input {
            position: relative;
        }

        .money-input span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);

            font-size: 20px;
            color: #374151;

            pointer-events: none;
        }

        input {
            font-family: inherit;
        }

        .money-input input {
            width: 100%;
            height: 52px;

            padding: 0 12px 0 38px;

            border: 1.5px solid #b8c9c0;
            border-radius: 14px;

            background: white;

            font-size: 20px;
            color: #166534;

            outline: none;
        }

        .money-input input:focus {
            border-color: #22a05a;
            box-shadow: 0 0 0 3px rgba(34, 160, 90, 0.12);
        }

        /* --------------------------------
           DAY CARDS
        -------------------------------- */

        .day-card {
            background: #f1f6ff;
            border: 1.5px solid #bdd4ff;

            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.035);
        }

        .day-heading {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 14px;
        }

        .day-number {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #2878e8;
            color: white;

            font-size: 17px;
            font-weight: 600;
        }

        .day-title {
            font-size: 20px;
            font-weight: 650;
        }

        .crew-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .crew-label {
            display: block;

            font-size: 15px;
            font-style: italic;
            font-weight: 500;

            margin: 0 0 7px 3px;
        }

        .crew-stepper {
            height: 48px;

            display: grid;
            grid-template-columns: 45px 1fr 45px;
            align-items: center;

            background: white;
            border: 1.5px solid #cdd5df;
            border-radius: 13px;

            overflow: hidden;
        }

        .crew-stepper button {
            height: 100%;

            border: none;
            background: transparent;

            font-size: 23px;
            font-weight: 600;

            cursor: pointer;
            touch-action: manipulation;
        }

        .crew-stepper .minus {
            color: #dc2626;
        }

        .crew-stepper .plus {
            color: #15803d;
        }

        .crew-value {
            text-align: center;
            font-size: 20px;
        }

        /* --------------------------------
           EXTRA EXPENSES
        -------------------------------- */

        .extra-card {
            background: #fff8e7;
            border: 1.5px solid #f0d99a;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;
        }

        .extra-title {
            font-size: 17px;
            font-weight: 600;
        }

        .extra-input {
            position: relative;
            width: 145px;
            flex-shrink: 0;
        }

        .extra-input span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .extra-input input {
            width: 100%;
            height: 45px;

            padding: 0 10px 0 30px;

            border: 1.5px solid #d4d4d4;
            border-radius: 12px;

            background: white;

            font-size: 17px;
            text-align: right;

            outline: none;
        }

        /* --------------------------------
           SUMMARY
        -------------------------------- */

        .summary-card {
            background: white;
            border: 1.5px solid #8bc9a8;

            padding: 22px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;

            align-items: center;
        }

        .total-section {
            text-align: center;
        }

        .total-label {
            font-size: 14px;
            font-weight: 650;
            color: #166534;
            margin-bottom: 4px;
        }

        .total-value {
            font-size: 32px;
            font-weight: 750;
            color: #166534;
            white-space: nowrap;
        }

        .breakdown {
            border-left: 1px solid #d1d5db;
            padding-left: 20px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;

            gap: 12px;

            font-size: 14px;
            margin-bottom: 8px;
        }

        .breakdown-row.total {
            border-top: 1px solid #d1d5db;
            padding-top: 8px;
            margin-top: 4px;

            color: #166534;
            font-weight: 650;
        }

        /* --------------------------------
           BUTTONS
        -------------------------------- */

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

            margin-top: 14px;
        }

        .action-button {
            height: 46px;

            border-radius: 13px;
            border: 1.5px solid #d1d5db;

            background: white;

            font-family: inherit;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            touch-action: manipulation;
        }

        .reset-button {
            background: #16834c;
            color: white;
            border-color: #16834c;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        /* --------------------------------
           SMALL SCREENS
        -------------------------------- */

        @media (max-width: 480px) {

            body {
                padding: 10px 8px 25px;
            }

            .card {
                padding: 16px;
                border-radius: 18px;
            }

            .rate-grid,
            .crew-grid {
                gap: 9px;
            }

            .field-label,
            .crew-label {
                font-size: 13px;
            }

            .money-input input {
                font-size: 18px;
                height: 48px;
            }

            .total-value {
                font-size: 27px;
            }

            .summary-grid {
                gap: 12px;
            }

            .breakdown {
                padding-left: 12px;
            }

            .breakdown-row {
                font-size: 12px;
            }
        }

        /* --------------------------------
           VERY SMALL PHONES
        -------------------------------- */

        @media (max-width: 360px) {

            .card {
                padding: 13px;
            }

            .total-value {
                font-size: 24px;
            }

            .breakdown-row {
                font-size: 11px;
            }

            .extra-title {
                font-size: 14px;
            }

            .extra-input {
                width: 125px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="business-name">Golden Knot Photography</div>
    <div class="page-subtitle">Event Estimate Calculator</div>
</header>

<div class="container">

    <!-- ================================
         SETTINGS
    ================================= -->

    <div class="card settings-card">

        <div class="days-title">
            Number of Days
        </div>

        <div class="stepper">

            <button class="minus" onclick="changeDays(-1)">
                −
            </button>

            <div class="stepper-value" id="daysValue">
                1
            </div>

            <button class="plus" onclick="changeDays(1)">
                +
            </button>

        </div>


        <div class="rate-grid">

            <!-- Photographer Rate -->

            <div>
                <label class="field-label">
                    Photographers Avg. Amount
                </label>

                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="photographerRate"
                        type="text"
                        inputmode="numeric"
                        value="8,000"
                        oninput="formatRate(this); calculateTotal()"
                    >

                </div>
            </div>


            <!-- Videographer Rate -->

            <div>
                <label class="field-label">
                    Videographers Avg. Amount
                </label>

                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="videographerRate"
                        type="text"
                        inputmode="numeric"
                        value="10,000"
                        oninput="formatRate(this); calculateTotal()"
                    >

                </div>
            </div>

        </div>

    </div>


    <!-- ================================
         GENERATED DAYS
    ================================= -->

    <div id="daysContainer"></div>


    <!-- ================================
         EXTRA EXPENSES
    ================================= -->

    <div class="card extra-card">

        <div class="extra-title">
            Additional Expenses
        </div>

        <div class="extra-input">

            <span>₹</span>

            <input
                id="extraExpenses"
                type="text"
                inputmode="numeric"
                value="0"
                oninput="formatRate(this); calculateTotal()"
            >

        </div>

    </div>


    <!-- ================================
         SUMMARY
    ================================= -->

    <div class="card summary-card">

        <div class="summary-grid">

            <div class="total-section">

                <div class="total-label">
                    ESTIMATED TOTAL
                </div>

                <div class="total-value" id="totalAmount">
                    ₹10,000
                </div>

            </div>


            <div class="breakdown">

                <div class="breakdown-row">
                    <span>Photographers</span>
                    <span id="photographerTotal">₹0</span>
                </div>

                <div class="breakdown-row">
                    <span>Videographers</span>
                    <span id="videographerTotal">₹0</span>
                </div>

                <div class="breakdown-row">
                    <span>Additional</span>
                    <span id="extraTotal">₹0</span>
                </div>

                <div class="breakdown-row total">
                    <span>TOTAL</span>
                    <span id="breakdownTotal">₹10,000</span>
                </div>

            </div>

        </div>

    </div>


    <!-- ================================
         ACTION BUTTONS
    ================================= -->

    <div class="buttons">

        <button
            class="action-button reset-button"
            onclick="resetCalculator()"
        >
            ↻ &nbsp; Reset
        </button>

        <button
            class="action-button"
            onclick="window.print()"
        >
            ⎙ &nbsp; Print / Save
        </button>

    </div>

</div>


<script>

    /* =================================
       CALCULATOR STATE
    ================================= */

    let numberOfDays = 1;


    /* =================================
       CURRENCY FORMAT
    ================================= */

    function formatCurrency(amount) {

        return "₹" + Math.round(amount).toLocaleString("en-IN");

    }

    function formatRate(input) {

        // Remove everything except digits
        let value = input.value.replace(/\D/g, "");

        if (value === "") {
            input.value = "";
            return;
        }

        // Indian number formatting
        input.value = Number(value).toLocaleString("en-IN");
    }


    /* =================================
       CHANGE NUMBER OF DAYS
    ================================= */

    function changeDays(change) {

        numberOfDays += change;

        // Minimum 1 day
        if (numberOfDays < 1) {
            numberOfDays = 1;
        }

        // Maximum 30 days
        if (numberOfDays > 30) {
            numberOfDays = 30;
        }

        document.getElementById("daysValue").textContent =
            numberOfDays;

        generateDays();

        calculateTotal();
    }


    /* =================================
       GENERATE DAY CARDS
    ================================= */

    function generateDays() {

        const container =
            document.getElementById("daysContainer");

        container.innerHTML = "";


        for (let i = 1; i <= numberOfDays; i++) {

            const dayCard =
                document.createElement("div");

            dayCard.className = "card day-card";


            dayCard.innerHTML = `

                <div class="day-heading">

                    <div class="day-number">
                        ${i}
                    </div>

                    <div class="day-title">
                        Day - ${i}
                    </div>

                </div>


                <div class="crew-grid">

                    <!-- Photographer -->

                    <div>

                        <label class="crew-label">
                            Photographers
                        </label>

                        <div class="crew-stepper">

                            <button
                                class="minus"
                                onclick="changeCrew(${i}, 'photographer', -1)"
                            >
                                −
                            </button>

                            <div
                                class="crew-value"
                                id="photo-${i}"
                            >
                                1
                            </div>

                            <button
                                class="plus"
                                onclick="changeCrew(${i}, 'photographer', 1)"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Videographer -->

                    <div>

                        <label class="crew-label">
                            Videographers
                        </label>

                        <div class="crew-stepper">

                            <button
                                class="minus"
                                onclick="changeCrew(${i}, 'video', -1)"
                            >
                                −
                            </button>

                            <div
                                class="crew-value"
                                id="video-${i}"
                            >
                                1
                            </div>

                            <button
                                class="plus"
                                onclick="changeCrew(${i}, 'video', 1)"
                            >
                                +
                            </button>

                        </div>

                    </div>

                </div>
            `;


            container.appendChild(dayCard);
        }

    }


    /* =================================
       CHANGE CREW COUNT
    ================================= */

    function changeCrew(day, type, change) {

        const element =
            document.getElementById(
                `${type === "photographer" ? "photo" : "video"}-${day}`
            );


        let value =
            parseInt(element.textContent);


        value += change;


        // Minimum = 0
        if (value < 0) {
            value = 0;
        }


        // Maximum = 20
        if (value > 20) {
            value = 20;
        }


        element.textContent = value;


        calculateTotal();
    }


    /* =================================
       CALCULATE TOTAL
    ================================= */

    function calculateTotal() {

        const photographerRate =
            Number(
                document.getElementById("photographerRate").value.replace(/,/g, "")
            ) || 0;


        const videographerRate =
            Number(
                document.getElementById("videographerRate").value.replace(/,/g, "")
            ) || 0;


        const extraExpenses =
            Number(
                document.getElementById("extraExpenses").value.replace(/,/g, "")
            ) || 0;


        let photographerTotal = 0;
        let videographerTotal = 0;


        for (let i = 1; i <= numberOfDays; i++) {

            const photoElement =
                document.getElementById(`photo-${i}`);

            const videoElement =
                document.getElementById(`video-${i}`);


            if (!photoElement || !videoElement) {
                continue;
            }


            const photographers =
                Number(photoElement.textContent);


            const videographers =
                Number(videoElement.textContent);


            photographerTotal +=
                photographers * photographerRate;


            videographerTotal +=
                videographers * videographerRate;

        }


        const total =
            photographerTotal +
            videographerTotal +
            extraExpenses;


        /* Update display */

        document.getElementById("photographerTotal")
            .textContent = formatCurrency(photographerTotal);

        document.getElementById("videographerTotal")
            .textContent = formatCurrency(videographerTotal);

        document.getElementById("extraTotal")
            .textContent = formatCurrency(extraExpenses);

        document.getElementById("totalAmount")
            .textContent = formatCurrency(total);

        document.getElementById("breakdownTotal")
            .textContent = formatCurrency(total);

    }


    /* =================================
       RESET
    ================================= */

    function resetCalculator() {

        numberOfDays = 1;

        document.getElementById("daysValue")
            .textContent = "1";


        document.getElementById("photographerRate")
            .value = "8,000";


        document.getElementById("videographerRate")
            .value = "10,000";


        document.getElementById("extraExpenses")
            .value = "0";


        generateDays();

        calculateTotal();

    }


    /* =================================
       INITIALIZE
    ================================= */

    generateDays();

    calculateTotal();

</script>

</body>
</html>
