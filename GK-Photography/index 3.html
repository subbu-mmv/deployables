<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Golden Knot Photography - Event Estimate</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 20px 12px 40px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f7f8fa;
            color: #111827;
        }


        .container,
        .site-header {
            width: 100%;
            max-width: 620px;
            margin-left: auto;
            margin-right: auto;
        }


        /* --------------------------------
           HEADER
        -------------------------------- */

        .site-header {
            text-align: center;
            margin-bottom: 18px;
        }


        .business-name {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }


        .page-subtitle {
            margin-top: 3px;

            font-size: 13px;
            color: #6b7280;
            font-weight: 450;
        }


        /* --------------------------------
           GENERAL CARD
        -------------------------------- */

        .card {
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 14px;
        }


        /* --------------------------------
           SETTINGS / RATES
        -------------------------------- */

        .settings-card {
            background: #edf8f2;

            border: 1.5px solid #8bc9a8;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.05);
        }


        .days-title {
            text-align: center;

            font-size: 21px;
            font-weight: 650;

            margin-bottom: 10px;
        }


        /* --------------------------------
           STEPPER
        -------------------------------- */

        .stepper {
            height: 54px;

            display: grid;
            grid-template-columns: 55px 1fr 55px;
            align-items: center;

            background: white;

            border: 1.5px solid #b8c9c0;
            border-radius: 15px;

            overflow: hidden;
        }


        .stepper button {
            height: 100%;

            border: none;
            background: transparent;

            font-size: 27px;
            font-weight: 600;

            cursor: pointer;
            touch-action: manipulation;
        }


        .stepper button.minus {
            color: #dc2626;
        }


        .stepper button.plus {
            color: #15803d;
        }


        .stepper button:active {
            background: #f1f5f9;
        }


        .stepper-value {
            text-align: center;

            font-size: 25px;
            font-weight: 600;
        }


        /* --------------------------------
           RATE GRID
        -------------------------------- */

        .rate-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;

            margin-top: 20px;
        }


        .field-label {
            display: block;

            font-size: 15px;
            font-style: italic;
            font-weight: 500;

            margin: 0 0 7px 3px;
        }


        .money-input {
            position: relative;
        }


        .money-input span {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 20px;
            color: #374151;

            pointer-events: none;
        }


        .money-input input {
            width: 100%;
            height: 52px;

            padding: 0 12px 0 38px;

            border: 1.5px solid #b8c9c0;
            border-radius: 14px;

            background: white;

            font-size: 19px;
            color: #166534;

            outline: none;
        }


        .money-input input:focus {
            border-color: #22a05a;

            box-shadow:
                0 0 0 3px rgba(34, 160, 90, 0.12);
        }


        /* --------------------------------
           DAY CARDS
        -------------------------------- */

        .day-card {
            background: #f1f6ff;

            border: 1.5px solid #bdd4ff;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.035);
        }


        .day-heading {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 14px;
        }


        .day-number {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #2878e8;
            color: white;

            font-size: 17px;
            font-weight: 600;
        }


        .day-title {
            font-size: 20px;
            font-weight: 650;
        }


        .crew-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }


        .crew-item {
            min-width: 0;
        }


        .crew-label {
            display: block;

            font-size: 15px;
            font-style: italic;
            font-weight: 500;

            margin: 0 0 7px 3px;
        }


        .crew-stepper {
            height: 48px;

            display: grid;
            grid-template-columns: 45px 1fr 45px;
            align-items: center;

            background: white;

            border: 1.5px solid #cdd5df;
            border-radius: 13px;

            overflow: hidden;
        }


        .crew-stepper button {
            height: 100%;

            border: none;
            background: transparent;

            font-size: 23px;
            font-weight: 600;

            cursor: pointer;
            touch-action: manipulation;
        }


        .crew-stepper .minus {
            color: #dc2626;
        }


        .crew-stepper .plus {
            color: #15803d;
        }


        .crew-stepper button:active {
            background: #f1f5f9;
        }


        .crew-value {
            text-align: center;

            font-size: 20px;
        }


        /* --------------------------------
           ADDITIONAL
        -------------------------------- */

        .additional-card {
            background: #fff8e7;

            border: 1.5px solid #f0d99a;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.035);
        }


        .additional-title {
            font-size: 19px;
            font-weight: 650;

            margin-bottom: 15px;
        }


        .additional-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 10px;
        }


        .additional-row:last-child {
            margin-bottom: 0;
        }


        .additional-label {
            font-size: 14px;
            font-weight: 500;
        }


        .additional-input {
            position: relative;

            width: 140px;

            flex-shrink: 0;
        }


        .additional-input span {
            position: absolute;

            left: 12px;
            top: 50%;

            transform: translateY(-50%);

            color: #374151;

            pointer-events: none;
        }


        .additional-input input {
            width: 100%;
            height: 42px;

            padding: 0 10px 0 30px;

            border: 1.5px solid #d4d4d4;
            border-radius: 11px;

            background: white;

            font-size: 16px;
            text-align: right;

            outline: none;
        }


        .additional-input input:focus {
            border-color: #d5a72a;

            box-shadow:
                0 0 0 3px rgba(213, 167, 42, 0.12);
        }


        /* --------------------------------
           SUMMARY
        -------------------------------- */

        .summary-card {
            background: white;

            border: 1.5px solid #8bc9a8;

            padding: 22px;
        }


        .summary-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            align-items: center;
        }


        .total-section {
            text-align: center;
        }


        .total-label {
            font-size: 14px;
            font-weight: 650;

            color: #166534;

            margin-bottom: 4px;
        }


        .total-value {
            font-size: 32px;
            font-weight: 750;

            color: #166534;

            white-space: nowrap;
        }


        .breakdown {
            border-left: 1px solid #d1d5db;

            padding-left: 20px;
        }


        .breakdown-row {
            display: flex;

            justify-content: space-between;

            gap: 12px;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .breakdown-row.total {
            border-top: 1px solid #d1d5db;

            padding-top: 8px;
            margin-top: 4px;

            color: #166534;

            font-weight: 650;
        }


        /* --------------------------------
           BUTTONS
        -------------------------------- */

        .buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 14px;
        }


        .action-button {
            height: 46px;

            border-radius: 13px;

            border: 1.5px solid #d1d5db;

            background: white;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            touch-action: manipulation;
        }


        .reset-button {
            background: #16834c;

            color: white;

            border-color: #16834c;
        }


        .action-button:active {
            transform: scale(0.98);
        }


        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 480px) {

            body {
                padding: 10px 8px 25px;
            }


            .site-header {
                margin-bottom: 14px;
            }


            .business-name {
                font-size: 21px;
            }


            .card {
                padding: 16px;

                border-radius: 18px;
            }


            .rate-grid,
            .crew-grid {
                gap: 9px;
            }


            .field-label,
            .crew-label {
                font-size: 13px;
            }


            .money-input input {
                font-size: 17px;

                height: 48px;
            }


            .additional-label {
                font-size: 13px;
            }


            .additional-input {
                width: 125px;
            }


            .total-value {
                font-size: 27px;
            }


            .summary-grid {
                gap: 12px;
            }


            .breakdown {
                padding-left: 12px;
            }


            .breakdown-row {
                font-size: 12px;
            }

        }


        /* --------------------------------
           VERY SMALL PHONES
        -------------------------------- */

        @media (max-width: 360px) {

            .card {
                padding: 13px;
            }


            .business-name {
                font-size: 20px;
            }


            .total-value {
                font-size: 24px;
            }


            .breakdown-row {
                font-size: 11px;
            }


            .additional-label {
                font-size: 12px;
            }


            .additional-input {
                width: 115px;
            }

        }

    </style>

</head>


<body>


<header class="site-header">

    <div class="business-name">
        Golden Knot Photography
    </div>

    <div class="page-subtitle">
        Event Estimate Calculator
    </div>

</header>


<div class="container">


    <!-- =================================
         SETTINGS / AVERAGE RATES
    ================================== -->

    <div class="card settings-card">

        <div class="days-title">
            Number of Days
        </div>


        <div class="stepper">

            <button
                class="minus"
                onclick="changeDays(-1)"
            >
                −
            </button>


            <div
                class="stepper-value"
                id="daysValue"
            >
                1
            </div>


            <button
                class="plus"
                onclick="changeDays(1)"
            >
                +
            </button>

        </div>


        <div class="rate-grid">


            <!-- Photographer -->

            <div>

                <label class="field-label">
                    Photographer Avg. Amount
                </label>


                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="photographerRate"
                        type="text"
                        inputmode="numeric"
                        value="10,000"
                        oninput="formatRate(this); calculateTotal()"
                    >

                </div>

            </div>


            <!-- Videographer -->

            <div>

                <label class="field-label">
                    Videographer Avg. Amount
                </label>


                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="videographerRate"
                        type="text"
                        inputmode="numeric"
                        value="10,000"
                        oninput="formatRate(this); calculateTotal()"
                    >

                </div>

            </div>


            <!-- Drone -->

            <div>

                <label class="field-label">
                    Drone Avg. Amount
                </label>


                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="droneRate"
                        type="text"
                        inputmode="numeric"
                        value="5,000"
                        oninput="formatRate(this); calculateTotal()"
                    >

                </div>

            </div>


            <!-- LED Wall -->

            <div>

                <label class="field-label">
                    LED Wall Avg. Amount
                </label>


                <div class="money-input">

                    <span>₹</span>

                    <input
                        id="ledRate"
                        type="text"
                        inputmode="numeric"
                        value="15,000"
                        oninput="formatRate(this); calculateTotal()"
                    >

                </div>

            </div>

        </div>

    </div>


    <!-- =================================
         GENERATED DAYS
    ================================== -->

    <div id="daysContainer"></div>


    <!-- =================================
         ADDITIONAL
    ================================== -->

    <div class="card additional-card">

        <div class="additional-title">
            Additional
        </div>


        <div class="additional-row">

            <div class="additional-label">
                Reels / Shorts / Teasers
            </div>

            <div class="additional-input">

                <span>₹</span>

                <input
                    id="reels"
                    type="number"
                    min="0"
                    value="0"
                    oninput="calculateTotal()"
                >

            </div>

        </div>


        <div class="additional-row">

            <div class="additional-label">
                Album Sheets
            </div>

            <div class="additional-input">

                <span>₹</span>

                <input
                    id="album"
                    type="number"
                    min="0"
                    value="0"
                    oninput="calculateTotal()"
                >

            </div>

        </div>


        <div class="additional-row">

            <div class="additional-label">
                DVDs
            </div>

            <div class="additional-input">

                <span>₹</span>

                <input
                    id="dvds"
                    type="number"
                    min="0"
                    value="0"
                    oninput="calculateTotal()"
                >

            </div>

        </div>


        <div class="additional-row">

            <div class="additional-label">
                Other / Extra
            </div>

            <div class="additional-input">

                <span>₹</span>

                <input
                    id="other"
                    type="number"
                    min="0"
                    value="0"
                    oninput="calculateTotal()"
                >

            </div>

        </div>

    </div>


    <!-- =================================
         SUMMARY
    ================================== -->

    <div class="card summary-card">

        <div class="summary-grid">


            <div class="total-section">

                <div class="total-label">
                    ESTIMATED TOTAL
                </div>

                <div
                    class="total-value"
                    id="totalAmount"
                >
                    ₹25,000
                </div>

            </div>


            <div class="breakdown">

                <div class="breakdown-row">

                    <span>
                        Photographers
                    </span>

                    <span id="photographerTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row">

                    <span>
                        Videographers
                    </span>

                    <span id="videographerTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row">

                    <span>
                        Drones
                    </span>

                    <span id="droneTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row">

                    <span>
                        LED Walls
                    </span>

                    <span id="ledTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row">

                    <span>
                        Additional
                    </span>

                    <span id="additionalTotal">
                        ₹0
                    </span>

                </div>


                <div class="breakdown-row total">

                    <span>
                        TOTAL
                    </span>

                    <span id="breakdownTotal">
                        ₹25,000
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- =================================
         ACTIONS
    ================================== -->

    <div class="buttons">

        <button
            class="action-button reset-button"
            onclick="resetCalculator()"
        >
            ↻ &nbsp; Reset
        </button>


        <button
            class="action-button"
            onclick="window.print()"
        >
            ⎙ &nbsp; Print / Save
        </button>

    </div>


</div>


<script>


    /* =================================
       STATE
    ================================= */

    let numberOfDays = 1;


    /* =================================
       CURRENCY
    ================================= */

    function formatCurrency(amount) {

        return "₹" +
            Math.round(amount)
                .toLocaleString("en-IN");

    }


    /* =================================
       FORMAT RATE INPUT
    ================================= */

    function formatRate(input) {

        let value =
            input.value.replace(/\D/g, "");


        if (value === "") {

            input.value = "";

            return;

        }


        input.value =
            Number(value).toLocaleString("en-IN");

    }


    /* =================================
       CHANGE DAYS
    ================================= */

    function changeDays(change) {

        numberOfDays += change;


        if (numberOfDays < 1) {
            numberOfDays = 1;
        }


        if (numberOfDays > 30) {
            numberOfDays = 30;
        }


        document.getElementById("daysValue")
            .textContent = numberOfDays;


        generateDays();

        calculateTotal();

    }


    /* =================================
       GENERATE DAY CARDS
    ================================= */

    function generateDays() {

        const container =
            document.getElementById("daysContainer");


        container.innerHTML = "";


        for (
            let i = 1;
            i <= numberOfDays;
            i++
        ) {


            const dayCard =
                document.createElement("div");


            dayCard.className =
                "card day-card";


            dayCard.innerHTML = `

                <div class="day-heading">

                    <div class="day-number">
                        ${i}
                    </div>

                    <div class="day-title">
                        Day - ${i}
                    </div>

                </div>


                <div class="crew-grid">


                    <!-- Photographer -->

                    <div class="crew-item">

                        <label class="crew-label">
                            Photographers
                        </label>

                        <div class="crew-stepper">

                            <button
                                class="minus"
                                onclick="changeCrew(
                                    ${i},
                                    'photographer',
                                    -1
                                )"
                            >
                                −
                            </button>

                            <div
                                class="crew-value"
                                id="photo-${i}"
                            >
                                1
                            </div>

                            <button
                                class="plus"
                                onclick="changeCrew(
                                    ${i},
                                    'photographer',
                                    1
                                )"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Videographer -->

                    <div class="crew-item">

                        <label class="crew-label">
                            Videographers
                        </label>

                        <div class="crew-stepper">

                            <button
                                class="minus"
                                onclick="changeCrew(
                                    ${i},
                                    'video',
                                    -1
                                )"
                            >
                                −
                            </button>

                            <div
                                class="crew-value"
                                id="video-${i}"
                            >
                                1
                            </div>

                            <button
                                class="plus"
                                onclick="changeCrew(
                                    ${i},
                                    'video',
                                    1
                                )"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Drone -->

                    <div class="crew-item">

                        <label class="crew-label">
                            Drones
                        </label>

                        <div class="crew-stepper">

                            <button
                                class="minus"
                                onclick="changeCrew(
                                    ${i},
                                    'drone',
                                    -1
                                )"
                            >
                                −
                            </button>

                            <div
                                class="crew-value"
                                id="drone-${i}"
                            >
                                0
                            </div>

                            <button
                                class="plus"
                                onclick="changeCrew(
                                    ${i},
                                    'drone',
                                    1
                                )"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <!-- LED Wall -->

                    <div class="crew-item">

                        <label class="crew-label">
                            LED Walls
                        </label>

                        <div class="crew-stepper">

                            <button
                                class="minus"
                                onclick="changeCrew(
                                    ${i},
                                    'led',
                                    -1
                                )"
                            >
                                −
                            </button>

                            <div
                                class="crew-value"
                                id="led-${i}"
                            >
                                0
                            </div>

                            <button
                                class="plus"
                                onclick="changeCrew(
                                    ${i},
                                    'led',
                                    1
                                )"
                            >
                                +
                            </button>

                        </div>

                    </div>

                </div>

            `;


            container.appendChild(dayCard);

        }

    }


    /* =================================
       CHANGE CREW / EQUIPMENT
    ================================= */

    function changeCrew(day, type, change) {


        const prefixes = {

            photographer: "photo",

            video: "video",

            drone: "drone",

            led: "led"

        };


        const element =
            document.getElementById(
                `${prefixes[type]}-${day}`
            );


        let value =
            parseInt(element.textContent);


        value += change;


        if (value < 0) {
            value = 0;
        }


        if (value > 20) {
            value = 20;
        }


        element.textContent = value;


        calculateTotal();

    }


    /* =================================
       READ MONEY INPUT
    ================================= */

    function readMoneyInput(id) {

        return Number(

            document
                .getElementById(id)
                .value
                .replace(/,/g, "")

        ) || 0;

    }


    /* =================================
       CALCULATE
    ================================= */

    function calculateTotal() {


        const photographerRate =
            readMoneyInput("photographerRate");


        const videographerRate =
            readMoneyInput("videographerRate");


        const droneRate =
            readMoneyInput("droneRate");


        const ledRate =
            readMoneyInput("ledRate");


        const reels =
            Number(
                document.getElementById("reels").value
            ) || 0;


        const album =
            Number(
                document.getElementById("album").value
            ) || 0;


        const dvds =
            Number(
                document.getElementById("dvds").value
            ) || 0;


        const other =
            Number(
                document.getElementById("other").value
            ) || 0;


        let photographerTotal = 0;

        let videographerTotal = 0;

        let droneTotal = 0;

        let ledTotal = 0;


        for (
            let i = 1;
            i <= numberOfDays;
            i++
        ) {


            const photographers =
                Number(
                    document
                        .getElementById(`photo-${i}`)
                        .textContent
                );


            const videographers =
                Number(
                    document
                        .getElementById(`video-${i}`)
                        .textContent
                );


            const drones =
                Number(
                    document
                        .getElementById(`drone-${i}`)
                        .textContent
                );


            const ledWalls =
                Number(
                    document
                        .getElementById(`led-${i}`)
                        .textContent
                );


            photographerTotal +=
                photographers *
                photographerRate;


            videographerTotal +=
                videographers *
                videographerRate;


            droneTotal +=
                drones *
                droneRate;


            ledTotal +=
                ledWalls *
                ledRate;

        }


        const additionalTotal =
            reels +
            album +
            dvds +
            other;


        const total =
            photographerTotal +
            videographerTotal +
            droneTotal +
            ledTotal +
            additionalTotal;


        /* --------------------------------
           UPDATE DISPLAY
        -------------------------------- */

        document.getElementById(
            "photographerTotal"
        ).textContent =
            formatCurrency(photographerTotal);


        document.getElementById(
            "videographerTotal"
        ).textContent =
            formatCurrency(videographerTotal);


        document.getElementById(
            "droneTotal"
        ).textContent =
            formatCurrency(droneTotal);


        document.getElementById(
            "ledTotal"
        ).textContent =
            formatCurrency(ledTotal);


        document.getElementById(
            "additionalTotal"
        ).textContent =
            formatCurrency(additionalTotal);


        document.getElementById(
            "totalAmount"
        ).textContent =
