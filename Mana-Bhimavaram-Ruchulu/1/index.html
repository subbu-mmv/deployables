<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana Bhimavaram Ruchulu</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="header-container">
        
        <!-- Brand Logo -->
        <a href="#" class="brand-logo-link">
          <img src="../Logo.jpg" alt="Mana Bhimavaram Ruchulu Logo" class="brand-logo">
        </a>

        <!-- Middle Column: Title + Search -->
        <div class="header-center">
          <h1>Mana Bhimavaram Ruchulu</h1>
          <input id="search" type="search" placeholder="Search delicious food..." oninput="filterProducts()">
        </div>

        <!-- Right Column: WhatsApp & Cart -->
        <div class="header-actions">
          <a 
            href="https://wa.me/YOUR_PHONE_NUMBER" 
            target="_blank" 
            class="whatsapp-btn" 
            aria-label="Chat on WhatsApp"
          >
            <svg viewBox="0 0 24 24" class="whatsapp-icon">
              <path d="M12.031 2c-5.514 0-9.999 4.486-9.999 10 0 1.905.534 3.686 1.462 5.207l-1.494 5.459 5.592-1.467c1.472.827 3.167 1.298 4.962 1.298 5.514 0 9.999-4.486 9.999-10s-4.485-10-9.999-10zm0 18c-1.583 0-3.085-.429-4.39-1.199l-.315-.184-3.261.855.87-3.18-.205-.327c-.848-1.353-1.3-2.922-1.3-4.545 0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8zm4.586-5.864c-.251-.126-1.488-.735-1.719-.819-.23-.084-.398-.126-.566.126s-.652.819-.8.987c-.147.168-.294.188-.545.063-.251-.126-1.062-.391-2.022-1.248-.748-.667-1.253-1.492-1.4-1.743-.147-.251-.016-.387.11-.512.113-.113.251-.294.377-.441.126-.147.168-.251.251-.419.084-.168.042-.315-.021-.441-.063-.126-.566-1.365-.776-1.87-.204-.492-.412-.425-.566-.433-.147-.008-.315-.01-.483-.01s-.441.063-.672.315c-.23.251-.881.861-.881 2.099 0 1.238.902 2.434 1.028 2.602.126.168 1.776 2.712 4.303 3.802.601.259 1.07.414 1.436.531.603.191 1.152.164 1.586.099.484-.073 1.488-.609 1.697-1.197.209-.588.209-1.092.147-1.197-.063-.105-.23-.168-.481-.294z"/>
            </svg>
          </a>

          <button id="cartButton" onclick="openCart()" aria-label="View Cart">
            🛒 <span id="cartCount">0</span>
          </button>
        </div>

      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div id="products">
        <div class="loading-state">Loading products...</div>
      </div>
    </main>

    <!-- Cart Drawer Side Panel -->
    <div id="cartPanel">
      <div class="cartHeader">
        <h2>Your Cart</h2>
        <button onclick="closeCart()" aria-label="Close Cart">✕</button>
      </div>

      <div id="cartItems"></div>
      <hr>

      <div class="cartFooter">
        <h3 id="total">Total ₹0</h3>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
